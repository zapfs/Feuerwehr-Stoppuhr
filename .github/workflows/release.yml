name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dateien packen
        run: zip -r Leist-Pruef-Uhr.zip Leist-Pruef-Uhr.html manifest.json sw.js icons/

      - name: Release erstellen und Assets hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: Leist-Pruef-Uhr.zip
